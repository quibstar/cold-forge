# One Hetzner box runs the lot: the app, its database, and Caddy terminating
# TLS. Deliberately not Kubernetes — this is a single-operator tool, and the
# operational cost of anything cleverer is paid every day for a benefit that
# arrives at a scale this will not reach.
#
#     cp .env.example .env   # fill it in
#     docker compose up -d
#
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The app's migrations run at boot, so it must not start against a
      # database that is still coming up.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PHX_SERVER: "true"
      PHX_HOST: ${PHX_HOST}
      PORT: "4000"
      DATABASE_URL: ecto://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      UPLOADS_DIR: /app/uploads
      INBOUND_TOKEN: ${INBOUND_TOKEN}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_SES_REGION: ${AWS_SES_REGION}
    volumes:
      # Logos must outlive the image. The release keeps `priv` under a
      # versioned path, so this cannot live there — see `ColdForge.Uploads`.
      - uploads:/app/uploads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      PHX_HOST: ${PHX_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts; without this you re-issue on every
      # deploy and Let's Encrypt rate-limits you.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
